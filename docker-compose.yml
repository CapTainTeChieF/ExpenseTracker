services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: local_dev_password_change_me
      POSTGRES_DB: expense_tracker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - expense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  expense_pgdata:
