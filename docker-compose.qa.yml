# Isolated QA-only database. No connection to your Step 1/2/3 data volume.
# Use with: docker compose -f docker-compose.qa.yml -p expense-tracker-qa up -d --wait
services:
  postgres-qa:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: expense_qa
      POSTGRES_PASSWORD: qa_only_local_password_change_me
      POSTGRES_DB: expense_tracker_qa
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - expense_qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_qa -d expense_tracker_qa"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  expense_qa_pgdata:
